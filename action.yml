name: "Square Cloud Action"
description: "Deploy your application to Square Cloud from GitHub Actions"
author: "richaardev"
branding:
  icon: activity
  color: gray-dark
inputs:
  token:
    required: true
    description: "Square Cloud API key. Store it as a repository secret."
  command:
    required: false
    description: "Square Cloud CLI command to run, without the `squarecloud` prefix, for example `commit <app id> --restart`"
  version:
    required: false
    default: "latest"
    description: "Square Cloud CLI version to install, 3.1.0 or later, for example `3.1.0`"
  workdir:
    required: false
    default: "."
    description: "Folder the command runs in"
  install-only:
    required: false
    default: "false"
    description: "Only install the CLI and set SQUARECLOUD_API_KEY, for later steps of the job"

runs:
  using: node24
  main: "dist/index.js"
